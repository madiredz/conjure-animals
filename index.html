<style>
:root{color-scheme:dark;--bg:#0e1015;--card:#171a21;--card2:#1e222b;--line:#2a2f3b;--tx:#e8eaf0;--mu:#98a1b3;--ac:#7fd6b0;--ac2:#163a2e;--red:#ef6a6a;--amb:#e9b949;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55}
main{max-width:1000px;margin:0 auto;padding:40px 20px 80px}
h1{font-size:1.9rem;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--mu);margin:0 0 40px}
section{margin-bottom:40px}
h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:var(--mu);margin:0 0 14px;font-weight:600}
h2 span{color:var(--ac);margin-right:8px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.opt{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:14px 16px;text-align:left;font:inherit;cursor:pointer;transition:.15s}
.opt:hover{border-color:#41495a;background:var(--card2)}
.opt.on{border-color:var(--ac);background:var(--ac2)}
.opt b{display:block;font-size:1rem}
.opt small{color:var(--mu)}
.opt.on small{color:#b5e8d2}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{background:var(--card);border:1px solid var(--line);color:var(--mu);padding:8px 14px;border-radius:999px;font:inherit;font-size:.9rem;cursor:pointer}
.seg button.on{background:var(--ac2);border-color:var(--ac);color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
.head{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.head h3{font-size:1.6rem;margin:0}
.tag{color:var(--mu);font-size:.9rem}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--card2);border-radius:10px;padding:8px 16px;text-align:center;min-width:76px}
.stat small{display:block;color:var(--mu);font-size:.7rem;text-transform:uppercase;letter-spacing:.1em}
.stat b{font-size:1.3rem}
.desc{color:#c3c9d6;margin:18px 0 0}
.blk{margin-top:26px}
.blk h4{margin:0 0 10px;font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--ac)}
.item{padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item b{color:var(--tx)}
.item p{margin:2px 0 0;color:#c3c9d6}
.dp{display:inline-flex;flex-wrap:wrap;gap:8px;margin:8px 10px 0 0}
.dmg{display:inline-flex;flex-direction:column;background:#2b1f22;border:1px solid #5a2f35;color:#ffb3b3;border-radius:10px;padding:6px 14px;font-weight:700;font-size:1.1rem;line-height:1.25}
.dmg small{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:#d99;font-weight:600}
.dmg.roll{background:var(--card2);border-color:var(--line);color:var(--tx)}
.dmg.roll small{color:var(--mu)}
.meta{color:var(--mu);font-size:.9rem}
.trk-top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:16px}
.btn{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:8px 16px;font:inherit;cursor:pointer}
.btn:hover{border-color:#41495a}
.trk{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.t{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:16px}
.t.dead{opacity:.55}
.t .lb{display:flex;justify-content:space-between;color:var(--mu);font-size:.85rem;margin-bottom:8px}
.t .row{display:flex;align-items:center;gap:14px}
.t .num{font-size:2.4rem;font-weight:700;line-height:1;min-width:2ch}
.t .num small{font-size:.95rem;color:var(--mu);font-weight:400}
.arr{display:flex;flex-direction:column;gap:6px;margin-left:auto}
.arr button{width:44px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--tx);cursor:pointer;font-size:.9rem}
.arr button:hover{border-color:var(--ac);color:var(--ac)}
.bar{height:6px;background:#2d3340;border-radius:4px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;transition:.2s}
.empty{color:var(--mu);border:1px dashed var(--line);border-radius:12px;padding:22px}
@media(max-width:520px){main{padding:28px 14px 60px}.card{padding:20px}}
</style>
</head>

const plural=(n,w)=>n+" "+w+(n===1?"":"s");

function renderCR(){
  $("crs").innerHTML=["1/4","1/2","1","2"].map(k=>`<button class="opt ${k===cr?"on":""}" data-cr="${k}"><b>CR ${k}</b><small>${plural(BASE[k],"beast")} · ${D[k].length} options</small></button>`).join("");
}
function renderList(){
  $("s2").hidden=!cr;if(!cr)return;
  $("list").innerHTML=D[cr].map((a,i)=>`<button class="opt ${cur===a?"on":""}" data-i="${i}"><b>${a[0]}</b><small>AC ${a[1]} · HP ${a[2]}</small></button>`).join("");
}
function dmgHtml(s){
  return s.split(" + ").map(p=>p.replace(/^(\d+) \(([^)]+)\)(.*)$/,(m,n,d,r)=>`<span class="dp"><span class="dmg"><small>Average</small>${n}</span><span class="dmg roll"><small>Roll</small>${d}${r}</span></span>`)).join(" ");
}
function renderDetail(){
  $("s3").hidden=!cur;if(!cur)return;
  const [n,ac,mx,sz,desc,tr,ac_]=cur;
  const traits=tr?tr.split("|").map(t=>{const i=t.indexOf(":");return `<div class="item"><b>${t.slice(0,i)}.</b><p>${t.slice(i+1).trim()}</p></div>`}).join(""):"";
  const acts=ac_.split("|").map(a=>{
    const [nm,hit,reach,dmg,ex]=a.split(";");
    let line="";
    if(hit){const rg=/range/.test(reach||"");line=`<div class="meta">${rg?"Ranged":"Melee"} attack · ${hit} to hit · ${reach||"reach 5 ft."} · one target</div>`}
    return `<div class="item"><b>${nm}</b>${line}${dmg?`<div>${dmgHtml(dmg)}</div>`:""}${ex?`<p>${ex}</p>`:""}</div>`}).join("");
  const cnt=BASE[cr]*mult;
  $("detail").innerHTML=`<div class="card">
   <div class="head"><div><h3>${n}</h3><div class="tag">${sz} beast · fey while summoned · CR ${cr}</div></div>
   <div class="stats"><div class="stat"><small>AC</small><b>${ac}</b></div><div class="stat"><small>Max HP</small><b>${mx}</b></div></div></div>
   ${desc?`<p class="desc">${desc}</p>`:""}
   ${traits?`<div class="blk"><h4>Traits</h4>${traits}</div>`:""}
   <div class="blk"><h4>Actions</h4>${acts}</div>
   <div class="blk"><div class="trk-top"><h4 style="margin:0">Hit point trackers · ${plural(cnt,"beast")}</h4><button class="btn" id="reset">Reset all to ${mx}</button></div>
   <div class="seg" style="margin-bottom:18px" id="slots">${SLOTS.map(([l,m])=>`<button data-m="${m}" class="${m===mult?"on":""}">${l}-level slot · ×${m}</button>`).join("")}</div>
   <div class="trk" id="trk"></div></div></div>`;
  renderTrk();
}
function arr(){const mx=cur[2],c=BASE[cr]*mult,k=cur[0];const a=hp[k]=hp[k]||[];while(a.length<c)a.push(mx);return a}
function renderTrk(){
  const a=arr(),mx=cur[2],c=BASE[cr]*mult;
  $("trk").innerHTML=Array.from({length:c},(_,i)=>`<div class="t" id="t${i}"></div>`).join("");
  for(let i=0;i<c;i++)paint(i);
}
function paint(i){
  const v=arr()[i],mx=cur[2],p=v/mx;
  const col=p>.5?"var(--ac)":p>.25?"var(--amb)":"var(--red)";
  const el=$("t"+i);el.className="t"+(v===0?" dead":"");
  el.innerHTML=`<div class="lb"><span>Beast ${i+1}</span><span>${v===0?"Down":""}</span></div>
  <div class="row"><div class="num">${v}<small> / ${mx}</small></div>
  <div class="arr"><button data-i="${i}" data-d="1" aria-label="Increase HP of beast ${i+1}">▲</button><button data-i="${i}" data-d="-1" aria-label="Decrease HP of beast ${i+1}">▼</button></div></div>
  <div class="bar"><i style="width:${p*100}%;background:${col}"></i></div>`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.cr){cr=b.dataset.cr;cur=null;renderCR();renderList();renderDetail();}
  else if(b.closest("#list")){cur=D[cr][+b.dataset.i];renderList();renderDetail();$("s3").scrollIntoView({behavior:"smooth",block:"start"});}
  else if(b.closest("#slots")){mult=+b.dataset.m;renderDetail();}
  else if(b.id==="reset"){hp[cur[0]]=[];renderTrk();}
  else if(b.dataset.d){const a=arr(),i=+b.dataset.i;a[i]=Math.max(0,Math.min(cur[2],a[i]+ +b.dataset.d));paint(i);}
});
renderCR();
</script>
</body>
</html>
